name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs-web/**', 'docs/**', 'src/**', 'go.mod', 'go.sum', 'references.lock.json', 'scripts/generate-docs.py', 'scripts/generate-rpc-docs.py', 'scripts/generate-service-clients.py', 'scripts/check-api-docs.go', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs-web/**', 'docs/**', 'src/**', 'go.mod', 'go.sum', 'references.lock.json', 'scripts/generate-docs.py', 'scripts/generate-rpc-docs.py', 'scripts/generate-service-clients.py', 'scripts/check-api-docs.go', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Generate and build SDK documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the documentation compiler pin
        id: compiler
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open('docs-web/goalchemy.lock.json'))
          print('revision=' + pin['revision'])
          PY
      - uses: actions/checkout@v7
        with:
          repository: eugenioenko/goalchemy
          ref: ${{ steps.compiler.outputs.revision }}
          path: .local/docs/compiler
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .local/docs/compiler/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-web/pnpm-lock.yaml
      - name: Install documentation dependencies
        working-directory: docs-web
        run: pnpm install --frozen-lockfile
      - name: Check source comments and Astro
        working-directory: docs-web
        run: pnpm check
      - name: Build and verify links
        working-directory: docs-web
        run: pnpm build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-web/dist

  deploy:
    name: Publish SDK documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
