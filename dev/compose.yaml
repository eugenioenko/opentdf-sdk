# Linux Docker Engine: every process sees the same loopback issuer/KAS URLs.
name: tdf-sdk
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set by platform.sh}
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: opentdf
    volumes:
      - ../.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d opentdf]
      interval: 2s
      timeout: 3s
      retries: 60
  keycloak:
    image: ghcr.io/opentdf/keycloak-standard@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd
    network_mode: host
    command: [start-dev, --http-port=8888, --http-relative-path=/auth, --hostname=http://localhost:8888/auth, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: changeme
      KC_FEATURES: dpop
    volumes:
      - ../.local/keycloak:/opt/keycloak/data
  platform:
    image: tdf-sdk-platform:local
    build:
      context: ../.local
      dockerfile: ../dev/Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?set by platform.sh}
    network_mode: host
    command: [start, --config-file=/config/opentdf.yaml]
    volumes:
      - ./opentdf.yaml:/config/opentdf.yaml:ro
      - ../.local:/local:ro
    depends_on:
      postgres:
        condition: service_healthy
